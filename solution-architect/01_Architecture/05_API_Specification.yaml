openapi: 3.0.0
info:
  title: SR Watch Store API
  description: API for managing drops, checkouts, and user wallets.
  version: 1.0.0
paths:
  /drops:
    get:
      summary: List all available drops
      responses:
        '200':
          description: A list of drops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drop'
  /drops/{dropId}:
    get:
      summary: Get details of a specific drop
      parameters:
        - name: dropId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Drop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drop'
  /checkout:
    post:
      summary: Create a new checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
  /checkout/{checkoutId}:
    get:
      summary: Get the status of a checkout session
      parameters:
        - name: checkoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checkout session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
  /checkout/{checkoutId}/pay:
    post:
      summary: Process payment for the checkout
      parameters:
        - name: checkoutId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /wallet:
    get:
      summary: Get the user's wallet details
      responses:
        '200':
          description: Wallet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
  /wallet/payment-methods:
    post:
      summary: Add a new payment method to the wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethod'
      responses:
        '201':
          description: Payment method added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
  /wallet/payment-methods/{paymentMethodId}:
    delete:
      summary: Remove a payment method from the wallet
      parameters:
        - name: paymentMethodId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment method removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'

components:
  schemas:
    Drop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
    CheckoutRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
    Checkout:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [created, pending, paid, failed]
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: number
    PaymentRequest:
      type: object
      properties:
        paymentMethodId:
          type: string
    Payment:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [succeeded, failed]
        amount:
          type: number
    Wallet:
      type: object
      properties:
        userId:
          type: string
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [credit_card, paypal]
        last4:
          type: string
